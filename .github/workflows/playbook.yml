name: playbook

on:
  push:
    branches: [main]
    paths:
      - 'playbook/**'
      - 'vercel.json'
      - '.github/workflows/playbook.yml'
  pull_request:
    paths:
      - 'playbook/**'
      - 'vercel.json'
      - '.github/workflows/playbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: playbook
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playbook/pnpm-lock.yaml
      - name: Install paper build tools
        run: bash scripts/pdf/install.sh
      - run: pnpm install --frozen-lockfile
      - name: Build and verify site and paper
        run: bash scripts/pdf/publish.sh
        env:
          VERCEL: '1'
      - name: Verify the static output contract
        run: |
          test -f build/index.html
          test -f build/00.html
          test -f build/updates/4/index.html
          test -s build/spec.pdf
          test -s build/spec.pdf.sha256
