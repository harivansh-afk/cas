# Runs on the GitHub mirror only. The Forgejo origin has Actions disabled
# for this repo; commits arrive here via the push mirror and deploy from main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playbook
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playbook/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # spec.pdf is typeset from the same prerendered pages the site serves.
      - uses: astral-sh/setup-uv@v6
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pandoc librsvg2-bin latexmk texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern fonts-texgyre
      - run: python3 scripts/pdf/build.py --out build/spec.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playbook/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
