# Runs on the GitHub mirror. Forgejo Actions remain unchanged.
name: nix

on:
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'experiments/**'
      - 'templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - '.github/workflows/nix.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'experiments/**'
      - 'templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - '.github/workflows/nix.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Nix formatting
        run: nix fmt -- --ci
      - name: Evaluate both architectures
        run: nix flake check --no-build --all-systems
      - name: Build and test on x86_64
        run: nix flake check --print-build-logs
      - name: Build the guest and runner
        run: nix build .#vm-smoke --out-link result-vm --print-build-logs
      - name: Verify guest IO through KVM
        run: result-vm/bin/cas-vm-smoke --output results/ci-raw-smoke
      - name: Build the daemon guest and runner
        run: nix build .#daemon-smoke --out-link result-daemon --print-build-logs
      - name: Verify guest IO through cas-daemon
        run: result-daemon/bin/cas-vm-smoke --output results/ci-daemon-smoke
      - name: Build the staging guest and runner
        run: nix build .#staging-smoke --out-link result-staging --print-build-logs
      - name: Verify guest IO through staging
        run: result-staging/bin/cas-vm-smoke --output results/ci-staging-smoke
      - name: Verify staging after killing the daemon
        run: result-staging/bin/cas-vm-smoke --recovery --output results/ci-recovery-smoke
      - name: Verify live serial recovery at write boundaries
        run: |
          for point in before-submit after-storage after-status after-used; do
            result-staging/bin/cas-vm-smoke --live-recovery --crash-at "$point" --output "results/ci-live-$point-smoke"
          done
      - name: Build the interactive guest
        run: nix build .#dev-vm --out-link result-dev --print-build-logs
      - name: Verify SSH access and manual CAS IO
        run: nix develop -c bash crates/harnesses/tests/ssh.sh result-dev/bin/cas-dev-vm results/ci-ssh-smoke
      - name: Keep run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-smoke
          path: |
            results/ci-*-smoke/summary.json
            results/ci-*-smoke/console.log
            results/ci-*-smoke/build.json
            results/ci-*-smoke/flake.lock
            results/ci-*-smoke/guest/
            results/ci-*-smoke/daemon.json
            results/ci-*-smoke/daemon.log
            results/ci-recovery-smoke/write/console.log
            results/ci-recovery-smoke/write/daemon.log
            results/ci-recovery-smoke/write/guest/
            results/ci-recovery-smoke/read/console.log
            results/ci-recovery-smoke/read/daemon.log
            results/ci-recovery-smoke/read/daemon.json
            results/ci-recovery-smoke/read/guest/
            results/ci-live-*-smoke/daemon-*.log
            results/ci-live-*-smoke/daemon-*.json
            results/ci-live-*-smoke/pause.json
            results/ci-ssh-smoke/*.log
            results/ci-ssh-smoke/listener.txt
            results/ci-ssh-smoke/session/*.json
            results/ci-ssh-smoke/session/*.log
            results/ci-ssh-smoke/session/flake.lock
            results/ci-ssh-smoke/session/known_hosts
            results/ci-ssh-smoke/session/guest/
          if-no-files-found: ignore
