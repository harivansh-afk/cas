[workspace]
members = ["crates/cas-core", "crates/cas-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
cas-core = { path = "crates/cas-core" }
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
libc = "0.2"
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
