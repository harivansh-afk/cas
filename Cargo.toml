[workspace]
members = ["crates/cas/core", "crates/cas/cli", "crates/cas/daemon", "crates/harnesses"]
exclude = ["crates/vendor/vhost-user-backend-0.23.0", "crates/vendor/virtio-queue-0.18.0"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
allocator-api2 = "0.2.21"
arena-btreemap = "=0.1.2"
arrayvec = "0.7.6"
blake3 = "1.8"
cas-core = { path = "crates/cas/core" }
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
hashbrown = { version = "0.17.1", default-features = false, features = ["allocator-api2"] }
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
vhost = "0.17"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[patch.crates-io]
virtio-queue = { path = "crates/vendor/virtio-queue-0.18.0" }
vhost-user-backend = { path = "crates/vendor/vhost-user-backend-0.23.0" }
